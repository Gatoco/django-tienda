{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="alert alert-info display-1 text-center my-5">Mi tienda 🐍</div>
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header"><h1>Detalle del producto</h1></div>
                    <div class="card-body">
                        <div class="row justify-content-center">
                            <div class="col-6">
                                <div class="card">
                                    <img src="{{producto.imagen}}" alt="" class="card-img-top">
                                    <div class="card-body">
                                        <h5 class="card-title">{{producto.nombre}}</h5>
                                        <p class="card-text my-0">{{producto.descripcion}}</p>
                                        <p class="card-text mb-2"><strong>{{producto.precio}}</strong></p>
                                        <a href="{% url 'electronica' %}" class="btn btn-danger">Volver</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
